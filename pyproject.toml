[project]
name = "trading-bot"
version = "0.2.0"
description = "MNQ intraday futures trading system, plus a daily RSI(2) pullback scanner"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
    "yfinance>=0.2.54",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tradebot = "tradebot.app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Mixed layout: the futures system lives under src/, the older scanner at the repo root.
where = ["src", "."]
include = ["tradebot*", "scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `pytest` works in a checkout that has not been pip-installed.
pythonpath = ["src", "."]
