[project]
name = "rsi2-scanner"
version = "0.1.0"
description = "Daily RSI(2) pullback scanner for US stocks and ETFs"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.54",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
