# Strategy parameters from NQ_15s_Strategy.pdf, Section 14 ("Parameter Summary").
# These are literature defaults / doc-specified starting points, NOT calibrated on real data
# (we have none). Treat every value here as a hypothesis the live run will test, not a fact.

instrument:
  symbol: NQ
  tick_size: 0.25
  tick_value_usd: 5.0
  point_value_usd: 20.0

bar:
  seconds: 15

session:
  timezone: US/Eastern
  rth_start: "09:30"
  rth_end: "16:00"
  # No new entries in the first/last N minutes of RTH (doc Section 14: "reduced or no trading
  # in the first/last minutes"). Existing positions still managed/flattened normally.
  open_buffer_minutes: 5
  close_buffer_minutes: 5
  # Force-flatten any open position this many minutes before RTH close.
  flatten_before_close_minutes: 2
  # Configurable, empty by default - doc Section 14/16 flags scheduled-news blackout as
  # something the design wants, but we have no news-calendar feed wired up yet (deferred,
  # see plan). Each entry: {start: "2026-08-05T14:30:00-04:00", end: "2026-08-05T14:45:00-04:00"}.
  news_blackout_windows: []

regime:
  # Axis 1 - directionality
  efficiency_ratio_window: 40 # doc range 20-60
  adx_period: 14
  adx_trend_threshold: 25.0 # declare TREND once ADX crosses above this
  adx_range_threshold: 20.0 # revoke TREND only once ADX falls below this (hysteresis gap)
  # ER/autocorrelation aren't given explicit numbers in the doc (only ADX 25/20 is) - these
  # are our own choice, used only to *confirm* a fresh RANGE->TREND transition, not to gate
  # the exit (doc Section 7: revocation is single-criterion, on ADX alone).
  efficiency_ratio_trend_min: 0.25
  autocorr_trend_min: 0.0
  autocorr_window: 20
  autocorr_lag: 1
  # Axis 2 - volatility
  realized_vol_window: 50 # doc range 20-80
  atr_period: 14
  vol_high_percentile: 0.85 # ATR percentile (rolling) above which we call HIGH_VOL
  vol_low_percentile: 0.75 # hysteresis: only drop out of HIGH_VOL below this percentile
  vol_extreme_percentile: 0.97 # beyond this, volatility=EXTREME -> forces no-trade (Figure 3)
  # Minimum bars a regime must persist before a module is allowed to act on it (extra
  # whipsaw guard on top of the threshold hysteresis itself).
  min_regime_persistence_bars: 4

trend_module:
  donchian_window: 20
  ema_fast: 9
  volume_surge_window: 50
  volume_surge_mult: 1.5
  pullback_ema: 21
  atr_stop_mult: 1.25 # doc range 1.0-1.5
  partial_take_r: 1.0
  time_stop_bars: 40 # ~10 minutes at 15s/bar - "should follow through quickly"
  chandelier_atr_mult: 2.0

range_module:
  bollinger_window: 20
  bollinger_std_mult: 2.0
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  vwap_reset: session
  band_stop_atr_mult: 0.75
  volume_spike_guard_mult: 1.5 # a volume spike at the band warns of breakout, not fade - skip

costs:
  commission_round_trip_usd: 2.50
  slippage_ticks_per_side: 1
  slippage_stress_ticks_per_side: 2
